name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # A mesma versão que o instalador embarca (ADR-0013). Testar em versão
  # diferente da que roda na loja invalida o teste no ponto que mais importa:
  # plano de execução, tipos e comportamento de transação.
  POSTGRES_VERSION: "17"

jobs:
  # Portões de qualidade do CLAUDE.md §7. Todos bloqueiam o merge.
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_teste
        ports:
          - 5432:5432
        # Sem o healthcheck, o passo de teste começa antes do banco aceitar
        # conexão e falha por corrida, não por defeito.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TESTE: postgresql://erp:erp@localhost:5432/erp_teste

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        # --frozen-lockfile: o CI nunca resolve versão diferente da do
        # desenvolvedor. Build reproduzível é veto do DevOps.
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Tipagem
        run: pnpm typecheck

      - name: Regras de arquitetura
        # Valida o grafo de docs/ARQUITETURA.md §3.3. Sem este passo, a
        # separação de camadas dura até o primeiro prazo apertado.
        run: pnpm arch

      - name: Testes com cobertura
        run: pnpm test:cov

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Auditoria de dependências
        # Vulnerabilidade alta ou crítica bloqueia o merge (CLAUDE.md §7).
        run: pnpm audit --audit-level high
