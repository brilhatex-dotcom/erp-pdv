name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # A mesma versão que o instalador embarca (ADR-0013). Testar em versão
  # diferente da que roda na loja invalida o teste no ponto que mais importa:
  # plano de execução, tipos e comportamento de transação.
  POSTGRES_VERSION: "17"

jobs:
  # Portões de qualidade do CLAUDE.md §7. Todos bloqueiam o merge.
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_teste
        ports:
          - 5432:5432
        # Sem o healthcheck, o passo de teste começa antes do banco aceitar
        # conexão e falha por corrida, não por defeito.
        # `-U erp -d erp_teste` explícitos: sem eles o `pg_isready` tenta o
        # usuário do sistema e o log do serviço enche de `FATAL: role "root"
        # does not exist` a cada 5 s. O healthcheck passa mesmo assim, mas erro
        # falso no log faz alguém perseguir a causa errada quando algo de
        # verdade quebrar.
        options: >-
          --health-cmd "pg_isready -U erp -d erp_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TESTE: postgresql://erp:erp@localhost:5432/erp_teste
      DATABASE_URL_TESTE_API: postgresql://erp:erp@localhost:5432/erp_teste_api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Criar bancos de teste
        # Um por suíte: o Turbo roda os pacotes em paralelo, e duas suítes
        # truncando as mesmas tabelas dariam falha intermitente.
        run: |
          PGPASSWORD=erp psql -h localhost -U erp -d erp_teste -c "SELECT 1" >/dev/null
          PGPASSWORD=erp createdb -h localhost -U erp erp_teste_api

      - name: Instalar dependências
        # --frozen-lockfile: o CI nunca resolve versão diferente da do
        # desenvolvedor. Build reproduzível é veto do DevOps.
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Tipagem
        run: pnpm typecheck

      - name: Regras de arquitetura
        # Valida o grafo de docs/ARQUITETURA.md §3.3. Sem este passo, a
        # separação de camadas dura até o primeiro prazo apertado.
        run: pnpm arch

      - name: Testes com cobertura
        run: pnpm test:cov

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Auditoria das dependências de produção
        # BLOQUEIA o merge (CLAUDE.md §7). `--prod` de propósito: este passo mede
        # o que é instalado na loja.
        #
        # Auditar tudo mede a coisa errada — as falhas altas de hoje estão em
        # `brace-expansion`, arrastado por ESLint e Vitest, sem nada vulnerável
        # no produto. E portão que mede errado empurra para a solução errada:
        # a tentativa de calar aquilo forçando a versão nova quebra o provedor
        # de cobertura, porque `minimatch@9` é CommonJS e a linha 5.x é ESM.
        run: pnpm audit --prod --audit-level high

      - name: Auditoria do ferramental (informativa)
        # NÃO bloqueia: vulnerabilidade em ESLint ou Vitest não chega ao cliente,
        # e travar a entrega por causa dela pararia a loja por um risco que não
        # existe na loja. Fica visível para ser resolvida quando houver correção
        # compatível — e para que ninguém precise descobrir de novo por que o
        # passo acima usa `--prod`.
        continue-on-error: true
        run: pnpm audit --audit-level high
